  {t:'Name the process owner and the QA counterpart', who:'Operations Manager', d:'Every process has exactly one ops owner and one named QA counterpart. They co-own everything below, a process without both names attached is not established yet.'},
  {t:'Share the SOPs and client documents with QA', who:'Team Lead', d:'Share the link with QA for the SOPs, client updates and any other relevant documents needed to work on that specific process or project.'},
  {t:'Share the client QA scorecard', who:'Team Lead', d:'Share the client\u2019s QA scorecard with QA, along with the relevant intervals, if applicable.'},
  {t:'Follow the internal sampling grid', who:'QA Lead', d:'Sampling follows the internal sampling grid, which is already decided, it is not reset for each new process.'},
  {t:'Agree when the reports will come', who:'QA Lead + Ops owner', d:'Confirm the date on which QA will share the first report. Then agree the interval on which QA will share reports after that: weekly or monthly, along with the day it will be shared and roughly what time.'},
  {t:'QA follows the same scorecard as Sasha\u2019s Third Eye', who:'QA', d:'QA uses the same scorecard that is followed in Sasha\u2019s Third Eye, so the scoring here matches the scoring everywhere else.'}
 ]}
]
},

{
id:'WF-07', cat:'workflow', title:'Escalation Handling & Matrix', short:'When and how to escalate: inside Purview and from the client, with the route, the SLA and where every escalation is logged.',
owner:'Operations Manager', applies:'Billers, Supervisors, Team Leads, Managers', version:'1.1', effective:'29 Sep 2026', review:'29 Mar 2027',
purpose:'Escalating on time is doing the job right. This workflow sets what belongs at each level, who it goes to, how fast it must be answered, and where it is recorded, for internal escalations and for escalations received from the client.',
sections:[
 {type:'table', name:'A. Escalation matrix', cols:['Level','Trigger','Route to','Response SLA'],
  rows:[
   ['L1. Biller \u2192 Supervisor','Anything blocking the user from performing; anything team related; any system or access related issue; anything conflict related; anything creating a blockage for performance','Supervisor','Same day'],
   ['L2. Supervisor \u2192 TL and Manager','Any salary related issue or salary discrepancy; any serious conflict related issue; any credentialing related issue in the internal systems (HR1, email and the rest); any issue with their leaves','Team Lead and Manager','1 business day'],
   ['L3. Manager \u2192 Ops Management','SLA at risk, client dissatisfaction, compliance concern, material financial exposure','Operations Manager','Same day'],
   ['Client-end','An escalation received from the client','Supervisor \u2192 next level of hierarchy if unresolved; Sasha is the last level','Acknowledge the same day, within 3 hours; RCA and mitigation plan shared with the client within 24 hours']
  ],
  note:'Every escalation, internal or client-end, is logged in the escalation tracker. Client escalations are also logged in the KPI and SLA tracker, because escalations are one of the KPI parameters carried for every client.'},
 {type:'steps', name:'B. Internal escalations', time:'Ongoing', steps:[
  {t:'Communicate it to the user verbally first', who:'Supervisor', d:'Every internal escalation is first communicated to the user verbally, they hear it from their supervisor before they read it anywhere.'},
  {t:'Document the escalation', who:'Supervisor', d:'Once it has been communicated verbally, document the escalation: what the issue is, who it concerns and when it was raised.'},
  {t:'Document the resolution and copy everyone on the email', who:'Supervisor', d:'Document the resolution as well. When the supervisor sends that email out: whether to the individual user or to the team, all the stakeholders and the hierarchy are copied on it.',
   note:{k:'comp', h:'Record', x:'Verbal first, then documented. An escalation that was only spoken about has no record, and a resolution email without the hierarchy in copy leaves the next level blind.'}}
 ]},
 {type:'steps', name:'C. Client-end escalations', time:'Ongoing', steps:[
  {t:'Acknowledge the same day, within 3 hours', who:'Supervisor', d:'An escalation received from the client is acknowledged the same day, within 3 hours of receiving it.'},
  {t:'Share the RCA and mitigation plan within 24 hours', who:'Supervisor', d:'Share the root cause and the mitigation plan with the client within 24 hours of the escalation, and document the escalation as you go.'},
  {t:'Check whether the client is satisfied', who:'Supervisor', d:'Check whether the client is satisfied with the resolution: the RCA and the mitigation plan shared with them. Satisfied: close it out and log it in the escalation tracker internally. Not satisfied: take it to the next level of the hierarchy.',
   note:{k:'esc', h:'Last level of contact', x:'Sasha is the last level of contact for handling any client related escalation.'}},
  {t:'Log it in the escalation tracker and the KPI/SLA tracker', who:'Supervisor', d:'Every client escalation is logged in the escalation tracker, and the same is logged in the KPI and SLA tracker: escalations are one of the KPI parameters we carry for every client.'}
 ]}
]
},

{
id:'WF-08', cat:'workflow', title:'Employee Lifecycle \u2014 Training, OJT & Production', short:'The lifecycle end to end: assessment gates and pass marks, training durations, QA sampling, OJT outcomes, and Observation and PIP.',
owner:'Training Lead + Supervisors', applies:'Trainers, Mentors, Supervisors, QA, HR', version:'1.2', effective:'29 Sep 2026', review:'29 Mar 2027',
purpose:'From allocation to production, every gate has a published pass mark and an assessment at the end of it, nobody moves to the next step without clearing the assessment. Results are communicated the same day, and every stage is documented and auditable. Freshers and experienced hires run different timelines but reach the same production standard.',
sections:[
 {ref:true, type:'table', name:'A. Assessment and training gates', cols:['Stage','Experienced','Freshers'],
  rows:[
   ['Initial assessment','The assessment is conducted on the same day as the date of joining. \u2265 85% \u2192 Process Training. 75\u201384% \u2192 reassessment (\u2265 85% \u2192 Process Training; below \u2192 escalate to Hiring Management)','Not applicable: freshers start with RCM training'],
   ['RCM training','Not applicable','3 weeks, with an assessment at the end. \u2265 75% \u2192 next phase. 65\u201374% \u2192 2\u20133 days of refresher training + reassessment (\u2265 75% \u2192 next phase; below \u2192 HR)'],
   ['HIPAA assessment','No HIPAA training is given to experienced hires. If the assessment is not cleared, reiterate the HIPAA policies and reassess','Conducted after the RCM training. If the assessment is not cleared, reiterate the HIPAA policies and reassess'],
   ['Process training','1 week, with an assessment at the end. \u2265 85% \u2192 OJT. 75\u201384% \u2192 2-day refresher + reassessment. Below 75% \u2192 HR','2 weeks, with an assessment at the end. \u2265 75% \u2192 OJT. 65\u201374% \u2192 2\u20133 days of refresher + reassessment. Below 65% \u2192 HR'],
   ['OJT','1 week: 90% productivity, 95% quality. Not cleared \u2192 1 week extension. Cleared, in the week or in the extension \u2192 production. Still not cleared \u2192 refer to HR','2 weeks: 80% productivity, 90% quality. Not cleared \u2192 1 week extension. Cleared, in the two weeks or in the extension \u2192 production. Still not cleared \u2192 refer to HR']
  ],
  note:'An assessment is conducted at the end of every training phase: RCM training, scope-of-work training and process training, and nobody moves to the next step without clearing it. Results are published the same day; this is mandatory. There is no pre-OJT practice stage: once the process training assessment is cleared, the joiner moves straight into OJT.'},
 {ref:true, type:'table', name:'B. QA sampling by status', cols:['Status','Target range','Why'],
  rows:[
   ['PIP / QIP','**100%**','On a formal plan, every claim is audited while the plan runs'],
   ['OJT · Fresher','**80–100%**','New to billing and working live claims: near-full coverage catches problems before they reach the client'],
   ['OJT · Experienced','**60–80%**','Knows billing, still learning this process'],
   ['Production · Fresher','**40–50%**','Recently moved to production; still needs a heavy safety net'],
   ['Observation','**30–40%**','Watch period after a dip or after exiting a plan'],
   ['Outlier','**20–30%**','Below 95% for 2+ consecutive weeks: raised coverage while the cause is established'],
   ['Production · Experienced','**5–10%**','Steady state: sample enough to detect drift without spending audit capacity']
  ],
  note:'This is the same sampling grid that Sasha’s Third Eye uses, so the sampling here and the sampling in the dashboard always match. Status comes from the Status column on the Validation roster; Fresher or Experienced is read from a Fresher column where present, otherwise from tenure under 6 months. Outlier is applied automatically when the report detects 2+ consecutive weeks below 95%, even if the roster still says Production or OJT: unless the associate is already on PIP/QIP or under Observation, which take precedence. Sampling % = audited claims \u00f7 production claims, per biller per day. **Training is not in the grid on purpose**, a joiner in training is not on production, so there is nothing for QA to audit. Sampling starts at OJT.'},
 {type:'steps', name:'C. Running the lifecycle', time:'Allocation \u2192 production', steps:[
  {t:'Allocate and introduce', who:'Higher Management \u2192 Supervisor', d:'Resources are allocated to projects by higher management on business requirements. The assigned supervisor conducts team introductions, ensures smooth onboarding, and aligns roles, responsibilities, and performance expectations.'},
  {t:'Run every gate with same-day results', who:'Trainer', d:'Assessments per the thresholds in table A, at the end of every training phase; results communicated the same day, this is mandatory, not a courtesy. All assessment and performance records are documented and auditable.'},
  {t:'Decide OJT outcomes', who:'Supervisor', d:'Targets met \u2192 production. Not met \u2192 extend the OJT by 1 week with weekly performance reviews and one-on-ones, and performance reports shared with stakeholders. Not cleared even after the extension \u2192 refer the case to HR with proper data and documentation.',
   note:{k:'esc', h:'Escalation', x:'Behavioural issues during Training, OJT or probation follow WF-05.'}},
  {t:'Move to production: metrics and stack ranking', who:'Supervisor', d:'Performance is tracked through structured metrics and stack ranking. Leave benefits activate after 6 months, once the employee is confirmed (PL-02), and probation confirmation follows the PL-02 gate.'},
  {t:'Observation on underperformance: 2 weeks', who:'Supervisor', d:'Underperformance in production triggers a 2-week Observation period: structured support and coaching, weekly performance reviews, transparent reporting to stakeholders. Improvement \u2192 exit Observation. No improvement \u2192 PIP, for confirmed employees only.',
   note:{k:'comp', h:'Probation employees', x:'Employees on probation are not eligible for PIP. Where there is a need, they are always put on Observation directly.'}},
  {t:'PIP: 2 weeks', who:'Supervisor + HR', d:'For confirmed employees. Meets expectations \u2192 continues in production. Does not \u2192 email to HR; separation runs through the pre-separation review in WF-05.'},
  {t:'Communicate and document the targets either way', who:'Supervisor', d:'For both PIP and Observation, the targets, the expectations and the duration are communicated to the user and documented by the supervisor. These can vary case by case; the standard durations are the ones stated in this document.',
   note:{k:'comp', h:'Record', x:'Nobody sits in Observation or on a PIP without knowing what they must reach and by when, in writing.'}}
 ]}
]
},

{
id:'WF-09', cat:'workflow', title:'QA Audit & Feedback Workflow', short:'The audit cycle end to end: sampling, scoring on the internal QA scorecard, fatal-error protocol, rebuttals and rework tracking, weekly feedback with proof, error-based and client-update training, and the outlier rule.',
owner:'QA Lead', applies:'QA team, Supervisors, Team Leads', version:'1.1', effective:'29 Sep 2026', review:'29 Mar 2027',
purpose:'Audits exist to improve claims, billers, and the process, in that order. This workflow runs the full loop: sample per policy, score by weightage, correct fatal errors the same day, let billers rebut, put feedback in front of every biller weekly with proof, and act on the outlier rule consistently.',
sections:[
 {type:'steps', name:'The audit cycle', time:'Daily / weekly rhythm', steps:[
  {t:'Sample per the policy, daily', who:'QA', d:'Selection per biller per day at that biller\u2019s status-based sampling tier. Sampling % = audited claims \u00f7 production claims: tracked per biller, so under-sampling is visible, not assumed.'},
  {t:'Follow the internal QA scorecard', who:'QA', d:'Every audit is scored on the internal QA scorecard: errors recorded per category with criticality Fatal / Major / Non-Fatal at the weightages on the scorecard; score = 1 \u2212 total weighted deduction. Only the parameters on the scorecard signed off for that process (WF-06) are scored, no ad-hoc deductions, and no auditor\u2019s own version of the sheet.'},
  {t:'Run the fatal-error protocol same day', who:'QA + Supervisor', d:'Fatal error found \u2192 the biller and supervisor are informed the same day, the claim is corrected at source, and the root cause is noted (knowledge gap, SOP gap, or slip, they have different fixes).',
   note:{k:'esc', h:'Escalation', x:'A fatal error touching PHI is also a compliance matter: route to management the same day under PL-04 assessment, in parallel with the correction.'}},
  {t:'Keep the rebuttal window open', who:'QA Lead', d:'A biller may rebut any finding within 48 hours with evidence. The QA Lead adjudicates; adjusted scores are logged with the reason. Rebuttals are a calibration input, not an offense.'},
  {t:'Track reworks and rebuttals', who:'QA', d:'QA keeps a running track of reworks and rebuttals: what was reworked, what was rebutted, what was accepted or rejected and why, and updates the same in both places: the QA scorecard they maintain, and Sasha\u2019s Third Eye (or the QA dashboard in use). Never a private sheet. The tracked numbers are what the rework and rebuttal trends are read from at review time, so the scorecard and the dashboard must agree.'},
  {t:'Deliver weekly feedback, with proof', who:'Supervisor', d:'Every biller\u2019s QA and production feedback is shared weekly. For any flagged (below-threshold) week, the feedback must be documented with proof: undocumented feedback counts as pending and shows as such on the performance dashboards.'},
  {t:'Apply the outlier rule consistently', who:'QA Lead + Supervisor', d:'A QA score below 95% for **2 or more consecutive weeks** puts the biller on **Outlier** status. It is applied automatically by the report: even where the roster still says Production or OJT, and it raises their sampling to **20\u201330%** (WF-08 table B) while the cause is established. If the biller is already on **PIP/QIP** or under **Observation**, those take precedence and their own sampling rate applies instead. Where the score does not recover, the QA Lead and supervisor recommend QIP/PIP from there. The rule is applied by the numbers, the same way for everyone.',
   note:{k:'comp', h:'Outlier is a status, not a label', x:'Outlier sits on the roster alongside Training, OJT, Production, Observation and PIP/QIP. It changes the sampling rate the moment it is applied, and it clears the same way once the score holds.'}},
  {t:'Calibrate monthly', who:'QA Lead + Ops', d:'QA and ops jointly score a common sample set each month; every disagreement settles into clearer parameter wording (WF-06), not a standing feud.'},
  {t:'Report the trends', who:'QA Lead', d:'Weekly biller-wise and client-wise QA report including a Pareto of error categories; the top categories feed the next training and refresher topics.'},
  {t:'Conduct error-based training sessions', who:'QA + Supervisor', d:'Errors found in audits are not closed with feedback alone. A training session is conducted on the errors themselves, so the same mistake is corrected across the team and not just for the biller who made it. The Pareto of error categories decides what the session covers.'},
  {t:'Run a session on every client update or new SOP', who:'QA + Supervisor', d:'Any client update received, or any new SOP shared by the client, is not simply forwarded on email. A session is conducted on it so the team hears what changed, what it means for their work, and from which date it applies.'},
  {t:'Assess after every session', who:'QA', d:'An assessment is taken after the session: error-based or client-update, to gauge whether the users have understood correctly what was explained. Scores are recorded; where the understanding is not there, the topic is reiterated rather than assumed to have landed.'},
  {t:'Route to discipline only through the process', who:'Supervisor', d:'Sustained below-target performance after documented coaching and support follows WF-05 from step 1. QA scores are evidence in that process, they never skip the pre-issuance steps on their own.'}
 ]}
]
},
{
id:'PL-01', cat:'policy', title:'Employee Referral Process', short:'How employees refer candidates, and the referral bonus: amount, milestones and the early-exit rule.',
owner:'HR', applies:'All employees; HR administers', version:'1.1', effective:'29 Sep 2026', review:'29 Mar 2027',
purpose:'Referrals are our best hiring channel when they are clean: the opening is announced internally, the referral is put on record by email to HR with the supervisor copied, and the bonus is paid on fixed milestones after the referred employee joins. This document states how a referral is raised and what the referral bonus is.',
sections:[
 {type:'steps', name:'Referral steps', time:'Ongoing', steps:[
  {t:'Announce the opening internally', who:'HR', d:'Open roles are posted internally with the requirements, the client/team, and the referral bonus amount and terms, so every referral is against a real, current opening.'},
  {t:'Send the resume and write to HR', who:'Referring employee', d:'Send the candidate\u2019s resume to HR by email, stating in that email that you are the one referring this candidate. Keep your supervisor copied on the same email so they are aware of the referral as well. The email is what puts the referral on record, a resume passed on verbally or over chat is not a referral.', note:{k:'comp', h:'The email must come first', x:'The resume and the email to HR must be sent **before the candidate joins**. If no referral email was sent beforehand and the candidate joins, a claim made afterwards: saying you were the one who referred them, is not considered, and no bonus is payable on it.'}},
  {t:'Pay the referral bonus', who:'HR / Payroll', d:'A referral bonus is payable **only for an experienced candidate**. **There is no referral bonus for a fresher**. Anyone who refers a fresher does not receive a referral amount, whatever the fresher goes on to do. The bonus applies to experienced referrals and to nothing else. For an experienced referral the total is **\u20b95,000**, released in two halves against the referred employee\u2019s date of joining. Both halves are always released with the payroll cycle, once the stipulated time frame is complete, never off-cycle.', tables:[{title:'Referral bonus \u2014 experienced resource', cols:['Milestone','Amount'], rows:[['3 months completed from the referred employee\u2019s date of joining','\u20b92,500'],['A further 3 months completed (6 months from date of joining)','\u20b92,500'],['Total','**\u20b95,000**']]}], note:{k:'comp', h:'If the referred candidate leaves early', x:'If the referred candidate leaves before completing 6 months, only the first \u20b92,500 is paid: the second instalment is not released.'}},
  {t:'If the bonus is not released', who:'Referring employee \u2192 Supervisor', d:'If the referral bonus has not been released even though the milestone is complete, the employee writes to their supervisor by email. The supervisor then follows up with HR on it and comes back to the employee. The employee does not have to chase HR themselves: the follow-up runs through the supervisor.'},
  {t:'File the records', who:'HR', d:'The referral email (with the supervisor copied) and the payout record are filed with the hiring documents.'}
 ]}
]
},
{
id:'PL-02', cat:'policy', title:'Leave Policy & Probation Confirmation', short:'The official leave types and rules, the supervisor\u2019s approval process, LWP and the sandwich rule, and the probation confirmation gate.',
owner:'HR', applies:'All salaried employees; Supervisors approve; interns, temps, and contractors are not eligible', version:'1.3', effective:'29 Sep 2026', review:'29 Mar 2027',
purpose:'This is the supervisor\u2019s working version of the official Purview Leave Policy (Doc ID Purview/PL/LP). The signed policy on the Employee Self-Service portal is authoritative, and it is reviewed at least yearly with CEO approval. Leave is planned so client work never drops; approval exists only in writing; and probation ends with a documented decision, never by the calendar quietly running out.',
sections:[
 {type:'table', name:'A. Leave types \u2014 official entitlements', cols:['Type','Entitlement','Key rules'],
  rows:[
   ['Sick leave (SL)','1 per month; unused carries over until calendar year end','Approved at the supervisor\u2019s discretion. **Medical documents are required beyond one day for a confirmed employee, and for even a single day of sick leave for an employee on probation.** Any unplanned leave not applied for and approved before the start of the month is treated as SL, and as LWP if the balance is insufficient'],
   ['Half-day sick leave','\u2014','**Whenever a half day is taken it is always a sick leave, never a casual leave.** For falling sick during the shift; minimum 4 hours worked that day to qualify'],
   ['Casual leave (CL)','1 per month; unused carries forward','Request by email on or before the 25th of the previous month; approved ONLY on written email confirmation from the supervisor: submitting a request is not approval'],
   ['Half-day casual (paid)','\u2014','The only way a half day is a casual leave, and it must be **approved on or before the 25th of the previous month**, the same cycle as full-day casual leave. A half-day CL wanted in October is applied for and approved on or before 25 September. Minimum 4-hour shift to qualify'],
   ['Compensatory off','Earned for working a National / US Federal holiday or a week off','Full day worked required. A half day (4 hours) earns nothing; use within 6 months of accrual or it is forfeited (not reimbursed). A holiday falling on a weekend counts as a week off: working it earns one comp off. Extra day must be at the employer\u2019s request. **If the employee is paid overtime for working on a week off, no compensatory off is given for that day**, it is one or the other, never both'],
   ['Maternity / parental','Up to 8 weeks paid','Full-time employees with at least 12 months of service; for a newborn or newly adopted/placed child'],
   ['Leave without pay (LWP)','Not an entitlement','**LWP applies in exactly two cases: (1) the leave is unapproved, or (2) the leave is approved but there is no leave balance left.** In either case the day is loss of pay. Request about a week ahead; maximum 15 continuous approved days in a month with management approval, then report back on day 16 or submit a resignation/separation request to HR. Exceptions only with prior written management approval. **Two back-to-back LWPs taken without any prior intimation are forwarded to HR as absconding.**']
  ],
  note:'The Leave Policy document on the ESS portal is the authoritative source: if this table and the portal ever differ, the portal wins and this page gets corrected.'},
 {type:'steps', name:'B. Approving and managing leave', time:'Ongoing', steps:[
  {t:'Run the casual-leave calendar on the 25th', who:'Supervisor', d:'CL requests for the following month arrive by email on or before the 25th of the current month: leave wanted in October is applied for on or before 25 September. The same deadline applies to a **half-day casual leave**; a half day taken any other way is a sick leave. Approve or deny on email: the employee may treat leave as approved only after your written confirmation. Do not leave requests unanswered.'},
  {t:'Approve with coverage in mind, allow swaps within the month', who:'Supervisor', d:'Before approving, check inventory and team shrinkage and shift the allocation. An employee unsure of their date may swap it for another date within the same month, subject to your approval: leaves are not extended under any circumstances by default.'},
  {t:'Apply the LWP rule', who:'Supervisor', d:'Leave is LWP in two cases only: it was not approved, or it was approved but the employee has no leave balance left. In either case the day is loss of pay. Say this at the point the employee asks, not after the fact.',
   note:{k:'comp', h:'Approved, but no balance', x:'Where there was no leave in the bucket but the request was sent and approved, the day is still LWP, but **a note is mentioned against it**, and in that case the **sandwich policy does not apply**.'}},
  {t:'Handle extensions properly', who:'Supervisor', d:'A leave extension needs prior approval. If someone extends without it, the whole period is LWP: the originally approved days as well as the additional days.'},
  {t:'Apply the sandwich rule', who:'Supervisor', d:'Simple version: when two LWP days sit against a weekend, the weekend is counted as LWP as well.', tables:[{title:'When the sandwich rule applies', cols:['LWP falls on','Result'], rows:[['**Friday** and the following **Monday**','Rule applies. Saturday and Sunday are counted as LWP'],['**Thursday** and **Friday**','Rule applies: the Saturday and Sunday that follow are counted as LWP'],['**Monday** and **Tuesday**','Rule applies: the Saturday and Sunday before are counted as LWP']]}],
   note:{k:'comp', h:'When it does not apply', x:'The sandwich rule does not apply where the leave was requested and approved but there was no balance, that LWP carries a note instead (step 3).'}},
  {t:'Know the absconding trigger', who:'Supervisor \u2192 HR', d:'**Two back-to-back LWP days with no information and no approval**: after reasonable contact attempts on the registered phone, email, and official channels, is treated as absconding. Highlight it and refer it to HR; do not wait for a third day.',
   note:{k:'esc', h:'Escalation', x:'Absconding is then handled under WF-03: access revocation first, then the separation process.'}},
  {t:'Request medical documents where the policy allows', who:'Supervisor + HR', d:'**Documents are required beyond one day for a confirmed employee, and for even a single day for an employee on probation.** Beyond that, for frequent, long, or extended sick leaves (including illness arising out of pregnancy), medical documents may be required and are verified via admin and the internal medical team. Forged or manipulated documents \u2192 strict disciplinary action, up to termination.',
   note:{k:'comp', h:'Compliance', x:'Document verification is a defined policy right: use it through HR, never as a personal challenge to the employee.'}}
 ]},
 {type:'steps', name:'C. Probation and notice period', time:'First 6 months / notice month', steps:[
  {t:'Apply the probation and notice restrictions', who:'Supervisor', d:'No casual leave or comp-off during the 6-month probation period or the one-month notice period. **A comp-off may be availed during probation only where it would otherwise expire before the employee reaches their production period**: outside that, comp-off waits until after probation. Sick leave may be approved solely at the supervisor\u2019s discretion. Probation leave without valid cause and without written management approval directly impacts the confirmation decision.'},
  {t:'Use the probation corrective ladder', who:'Supervisor', d:'For probation attendance issues, case by case: 1st instance, verbal warning and counselling; 2nd, verbal warning; 3rd, written warning (3-month validity); 4th, referral to HR for review (probation extension or other measures decided on the employee\u2019s overall conduct).'},
  {t:'Confirm on time, every Friday', who:'Supervisor \u2192 HR', d:'Once an employee completes 6 months with satisfactory performance, each Friday when attendance closes the probation confirmation email goes to HR (Neena). Probation never lapses into confirmation by silence: the email is the gate.'},
  {t:'Extend probation where it is warranted', who:'Supervisor + HR', d:'Probation extends in two situations: if the employee is put back into training or OJT during probation, it extends by the period that training/OJT ran; and if too many leaves are taken during probation, it extends on that basis. **Leave benefits activate after 6 months, once the employee is a confirmed employee.**',
   note:{k:'comp', h:'How an extension is communicated', x:'Every probation extension is communicated in three steps: **tell the employee verbally first**, then **send the employee an email** confirming the extension, and then **send a separate email to the hierarchy and HR** to keep them informed. An extension the employee hears about only from HR, or only by email, has been handled wrongly.'}}
 ]}
]
},
{
id:'PL-03', cat:'policy', title:'Work From Home Policy', short:'When WFH is granted at all. The four grounds, the caps, Sasha’s approval, the daily email discipline, and how it is cancelled.',
owner:'Operations Manager + IT', applies:'Confirmed employees only; Supervisor recommends, Sasha approves', version:'1.1', effective:'29 Sep 2026', review:'29 Mar 2027',
purpose:'Work from home is not how we work. It is an exception granted on a named ground, for a capped period, on Sasha’s written approval, and it is run with more discipline than an office day, not less. Working from home changes where the work happens, never the standard it is held to, and never the protection around PHI.',
sections:[
 {type:'steps', name:'A. Eligibility and approval', time:'Before the first WFH day', steps:[
  {t:'Start from the default: WFH is not given', who:'Supervisor', d:'As a rule we do not give work from home. The one standing exception is where **the client requires it**, and then it can be given. Everything below is how the exception is granted; it is not an entitlement anybody can ask for as a matter of course.'},
  {t:'Check eligibility', who:'Supervisor', d:'WFH is only for **confirmed employees who have completed 6 months with the company**. Employees on probation, in Training or in OJT work from office. Role must be suitable for remote work, with no active warning and performance at target for the recent review period.'},
  {t:'Confirm the eligibility criteria', who:'Supervisor', d:'These four grounds **are the eligibility criteria** for work from home. A request that does not sit in one of them is not eligible, and the answer is no. Do not invent a fifth.',
   tables:[{title:'Eligibility criteria \u2014 the four grounds', cols:['Ground','Covers'], rows:[
     ['Bereavement','A death in the family or of someone close'],
     ['Medical issue','The employee’s own medical situation, or caring for an immediate family member'],
     ['Wedding','The wedding of someone close to the employee'],
     ['Exams','The employee’s own examinations']]}]},
  {t:'Apply the caps: once in 6 months, 30 days maximum', who:'Supervisor', d:'Work from home can be availed **once in six months**, and the maximum duration is **30 days**, never more. The dates are fixed at the time of approval, not open-ended.'},
  {t:'Verify the client allows it', who:'Operations Manager', d:'Some client contracts restrict where their work may be performed. Confirm the client’s contract and security requirements permit home working before approving.',
   note:{k:'comp', h:'Compliance', x:'A client-side location restriction overrides any internal approval. When in doubt, ask the client in writing via the escalation contact.'}},
  {t:'Route the approval: employee → supervisor → Sasha', who:'Employee → Supervisor → Sasha', d:'The request is **documented by the employee**. An email to their **immediate supervisor** setting out the ground and the dates. The supervisor **validates the request and approves the timeline**, then forwards it to **Sasha**, and **Sasha is the one who gives the final approval**. Everything must be **pre-approved** before the first WFH day. The request must be raised **at least 7 days in advance**; anything later is not a planned WFH. **An extension of work from home is decided case by case**, it is never automatic, and it goes back through the same route.',
   note:{k:'esc', h:'No approval, no WFH', x:'**If there is no approval from Sasha, work from home is not granted**, whatever the supervisor said, and whatever the ground. Verbal WFH does not exist.'}},
  {t:'Sign the workspace declaration', who:'Employee', d:'Private workspace where the screen is not visible to others, stable power, primary internet meeting the minimum speed plus a backup (hotspot), and a headset. The declaration is filed before the first WFH day.'}
 ]},
 {type:'steps', name:'B. Rules while working from home', time:'Every WFH day', steps:[
  {t:'Work through the remote desktop', who:'Employee + IT', d:'All work from home is done by connecting through the **remote desktop**, never on the local machine. That is what lets supervisors monitor from the office what is being worked on and how, the same visibility they have on the floor.'},
  {t:'Arrange your own system', who:'Employee', d:'**The company does not provide a system for work from home.** The employee arranges their own machine, internet and power, and connects to the company environment through the remote desktop. The work itself never leaves that remote session, nothing is stored, saved or worked on locally.',
   note:{k:'comp', h:'Non-negotiable', x:'A system that cannot hold a stable remote-desktop session is not a working-from-home setup. If it keeps dropping, the WFH ends: the company will not send a machine out to fix it.'}},
  {t:'Send the login and logout emails every day', who:'Employee', d:'A **login email** at the start of the shift and a **logout email** at the end, every single WFH day. The logout email must have the **production file attached**.',
   note:{k:'comp', h:'No production file, no production', x:'If the production file is not attached to the logout email, **the production for that day is not considered**, and the day is marked **LWP**.'}},
  {t:'Treat a lost day as LWP, a half day as half', who:'Supervisor', d:'If the employee did not work on a day they were supposed to work from home: internet outage, power outage, system issue, any reason at all, that day is marked **LWP**. If they completed **half the production**, it is counted as a **half day**.'},
  {t:'PHI stays in the systems', who:'Employee', d:'No printing, downloading, photographing, or copying of PHI at home. No public Wi-Fi. Calls involving PHI are taken where nobody can overhear, on a headset.',
   note:{k:'comp', h:'Compliance', x:'A PHI exposure at home is handled exactly like one in the office: report immediately (PL-04). “It was just at home” is not a mitigation.'}},
  {t:'Be reachable like you are in office', who:'Employee', d:'Logged in through the shift, responsive on chat within the agreed window, camera on for scheduled meetings, breaks per the office schedule.'},
  {t:'Attend every meeting, carry every responsibility', who:'Employee', d:'It is **mandatory** to join all meetings, every time, and to fulfil every responsibility exactly as the employee would in office. Working from home is not a reason to miss a huddle, a call or a review.'},
  {t:'No leave during the WFH period', who:'Employee + Supervisor', d:'An employee cannot take leave while on work from home **unless the leave was approved in advance**. WFH days are working days.'},
  {t:'Same targets, same QA', who:'Supervisor', d:'Production targets, QA sampling, and note standards are identical to office work. There is no separate WFH standard, in either direction.'}
 ]},
 {type:'steps', name:'C. Discrepancies and cancellation', time:'Whenever an issue is seen', steps:[
  {t:'First issue: email as a verbal warning', who:'Supervisor', d:'Where the supervisor identifies any discrepancy or issue with the employee\u2019s work from home, **an email is sent to the user as a verbal warning**, recording what was seen and what must change. **This is the only consideration given.**'},
  {t:'Second time: work from home is cancelled', who:'Supervisor', d:'If it happens **one more time**, the work from home is **cancelled**. The employee returns to office from that point and the remaining approved days lapse. There is no third chance.'},
  {t:'Revoke when the basis changes', who:'Operations Manager', d:'Separately from the ladder above, WFH is revoked for performance drops, availability problems, workspace/security concerns, or any compliance issue. Revocation is operational, not disciplinary by itself, but the underlying cause may also follow WF-05 or PL-04.',
   note:{k:'esc', h:'Report back the next day', x:'Once work from home is cancelled for any reason, the employee is to **report to the office immediately, the very next day**. Until they show up, **every day is marked LWP**.'}}
 ]}
]
},
{
id:'PL-04', cat:'policy', title:'Zero Tolerance Policies (ZTP)', short:'The official ZTP scenarios, the action each one carries: straight to HR, or a fixed warning-letter path for floor discipline, and the containment-first process.',
owner:'HR + Management', applies:'All employees; Supervisors report, HR + Management decide', version:'1.2', effective:'10 Sep 2026', review:'10 Mar 2027',
purpose:'Some conduct is not coached, warned, or given a second chance. It threatens patients\u2019 data, colleagues\u2019 safety, or the company\u2019s integrity. Per the official Employee Lifecycle Management SOP, most ZTP cases are referred directly to HR and bypass the progressive discipline ladder. Floor-discipline breaches: unauthorized phone use and tailgating, carry a fixed warning path instead: the consequence is set by policy, not decided case by case. The scenarios below are the official list; the process after them is about containing risk immediately and establishing facts fairly.',
sections:[
 {type:'table', name:'A. Official ZTP scenarios', cols:['Violation','What it covers','Action'],
  rows:[
   ['Physical fights','Physical fights on the production floor or anywhere at the workplace','Referred directly to HR, up to immediate termination'],
   ['Major behavioural incident on the floor','Serious misconduct witnessed on the floor: fights, abusive or threatening arguments, or similar behaviour that disrupts the floor','Formal written warning letter at minimum (WF-05); HR and management decide whether it goes higher'],
   ['Floor misconduct with abusive language','Arguments or misconduct on the floor involving abusive or inappropriate language','Referred directly to HR, up to immediate termination'],
   ['Theft','Theft of company property or another employee\u2019s belongings, especially when supported by CCTV or other evidence','Referred directly to HR, up to immediate termination'],
   ['Unauthorized client-data access or sharing','Access, sharing, or transfer of client data or information to unauthorized individuals or external parties','Referred directly to HR, up to immediate termination'],
   ['Photos or videos on the floor','Taking photographs/videos on the floor and sharing them externally in a manner that may harm the company\u2019s reputation or image','Referred directly to HR, up to immediate termination'],
   ['Mobile phone use on the floor','Using a mobile phone on the production floor by anyone not authorized to carry or use one there','Formal written warning letter (WF-05)'],
   ['Tailgating / punch fraud','Two or more employees leaving for or returning from a break together while only one punches, so the other\u2019s break time is not captured, and any similar covering of another person\u2019s attendance','1st instance: verbal warning, documented. Repeat: formal written warning letter (WF-05)'],
   ['Discrimination or harassment','Any discrimination, harassment, or inappropriate remarks related to race, religion, caste, gender, appearance, nationality, disability, or any other protected characteristic','Referred directly to HR, up to immediate termination'],
   ['Inappropriate physical contact','Inappropriate physical contact, touching, or harassment of another employee, especially when supported by CCTV or other evidence','Referred directly to HR, up to immediate termination'],
   ['Alcohol or drugs','Reporting to work or being under the influence of alcohol, drugs, or any prohibited substance during working hours or on company premises','Referred directly to HR, up to immediate termination'],
   ['Fraudulent or illegal activity','Any fraudulent, illegal, or unethical activity conducted inside or outside the workplace that results in police involvement, impacts clients/users, or damages the company\u2019s reputation and image','Referred directly to HR, up to immediate termination']
  ],
  note:'Accidental errors are not ZTP. An honest mistake in data handling is a compliance incident handled through training and, if repeated, WF-05. Intent, concealment, and evidence are what put conduct on this list. Floor-discipline items (phone use, tailgating) carry the graded consequences shown above rather than immediate HR referral, but they are still zero-tolerance policy. The consequence is fixed, not a supervisor\u2019s judgement call, and it is applied the same way for everyone.'},
 {type:'steps', name:'B. When a ZTP violation is suspected', time:'Starts the same day', steps:[
  {t:'Check which path the breach takes', who:'Supervisor', d:'Floor-discipline breaches: unauthorized mobile phone use on the floor, and tailgating/punch fraud, follow the fixed path in table A: phone use goes straight to a formal written warning letter; tailgating is a documented verbal warning on the first instance and a formal written warning letter on any repeat. Everything else on the list is referred to HR immediately. Either way the letter itself is issued through WF-05: facts verified, employee heard, manager and HR approval.',
   note:{k:'comp', h:'Consistency rule', x:'These consequences are set by policy. A supervisor cannot let a first tailgating instance pass unrecorded, an undocumented verbal warning means the repeat cannot be treated as a repeat.'}},
  {t:'Refer directly to HR, the same day', who:'Anyone \u2192 Supervisor \u2192 HR', d:'Whoever observes it reports it the same day. The supervisor\u2019s job is to secure the facts and refer the case directly to HR and management immediately. A supervisor never investigates, mediates, or settles a suspected ZTP matter alone, and never runs the warning ladder for it.'},
  {t:'Contain first', who:'Management \u2192 IT', d:'For data, security, theft, fraud, or safety matters: suspend the person\u2019s system access and remove them from active work pending investigation. Preserve evidence: CCTV footage, logs, messages, before it ages out.',
   note:{k:'comp', h:'Compliance', x:'Containment is protective and reversible, not a punishment. For suspected client-data matters, access suspension happens before the first investigative conversation.'}},
  {t:'Investigate formally', who:'HR + Management', d:'Evidence gathered, witnesses spoken to, and the employee\u2019s side heard and documented: fairness is not suspended because the allegation is serious. The supervisor provides facts and records; the supervisor does not decide.'},
  {t:'Decide outside the ladder', who:'HR + Management', d:'Confirmed ZTP violations do not enter the one-on-one \u2192 verbal \u2192 written progression: the outcome is decided by HR and management based on findings, severity, and honesty when confronted, up to immediate termination, through the pre-separation review in WF-05.'},
  {t:'Meet the regulatory duties', who:'Compliance / Management', d:'A confirmed client-data breach is assessed under the breach-notification process and the client is informed per BAA obligations, on the compliance clock, independent of the HR outcome.',
   note:{k:'esc', h:'Escalation', x:'Breach assessment and client notification run on legal timelines. They are never delayed to \u201cfinish the HR process first.\u201d'}},
  {t:'Document and close', who:'HR', d:'Findings, decision, and actions filed. Access is restored on clearance, or the exit runs per WF-03. Retaliation against a good-faith reporter is itself a ZTP matter.'}
 ]}
]
}
,
{
id:'PL-05', cat:'policy', title:'IJP & Appraisal Review', short:'Who is eligible for an internal job posting and the three rounds to clear: plus the October appraisal cycle and who takes each one-on-one.',
owner:'HR + Management', applies:'All confirmed employees; Supervisors and HR administer', version:'1.3', effective:'29 Sep 2026', review:'29 Mar 2027',
purpose:'Internal movement should be a real route, not a rumour. This document states exactly who can apply for an internal job posting, what disqualifies them, and what they have to clear to be promoted internally. The appraisal review section is held open until the review model is finalised.',
sections:[
 {type:'steps', name:'A. Internal Job Posting (IJP)', time:'Whenever a posting opens', steps:[
  {t:'Check the eligibility: there are only two conditions', who:'Supervisor + HR', d:'The employee must be a **confirmed employee**, and must have **no warning letter within the last 3 months**, counted back from the month in which the IJP is being conducted. That is the whole eligibility test, nothing else is added to it.',
   tables:[{title:'IJP eligibility', cols:['Condition','What it means'], rows:[
     ['Confirmed employee','Probation completed and confirmed: employees still on probation cannot apply'],
     ['No warning letter in the last 3 months','Counted back from the month the IJP is conducted. A warning letter inside that window makes the employee ineligible for this posting (WF-05)']]}],
   note:{k:'comp', h:'Tell the employee where they stand', x:'If an active warning letter makes someone ineligible, say so at the time they ask, not after they have applied and prepared.'}},
  {t:'Apply for the position', who:'Employee', d:'The employee applies for the position that is open. Eligibility is confirmed first; an application from someone who does not meet both conditions does not go forward.'},
  {t:'Clear the three rounds', who:'Hiring panel', d:'To be promoted internally, the employee has to **clear three rounds** for whichever position they have applied for. All three must be cleared: the rounds are not waived because the applicant is internal.'},
  {t:'Confirm the outcome, either way', who:'HR', d:'The IJP ends one of two ways, and both are communicated to the employee and their current supervisor, and filed. **Cleared:** the employee is **promoted to the position they applied for**. **Not cleared:** the employee can **try again in the next IJP session**. They are told where they fell short so they can learn from this attempt, implement those learnings, and come to the next one better prepared.',
   note:{k:'tip', h:'Not clearing is not a mark against them', x:'An unsuccessful IJP attempt is not held against the employee and does not affect their standing in their current role. The next session is a fresh attempt.'}}
 ]},
 {type:'steps', name:'B. Appraisal review', time:'October, every year', steps:[
  {t:'Know the cycle: appraisal review runs in October', who:'HR + Management', d:'The appraisal review cycle is in **October**. The review for **everyone** starts in that month, it is not staggered by joining date or by team.'},
  {t:'Hold the one-on-one with your own scope of people', who:'Per the table', d:'Every person has their appraisal one-on-one taken by the level above them. **The steps below are the same at every level**: only who sits across the table changes.',
   tables:[{title:'Who conducts the appraisal one-on-one', cols:['For','Conducted by'], rows:[
     ['Users','Their **Team Lead**'],
     ['Team Leads','Their **Manager**'],
     ['Managers','The **VP. Sasha**']]}]},
  {t:'Open by explaining how the review works', who:'Reviewer', d:'Start the session by explaining **how the appraisal review works** and **the parameters they are going to be evaluated on**. Nobody should be working out the rules while they are being reviewed against them.'},
  {t:'Appreciate them: say the good things out loud', who:'Reviewer', d:'Tell them **all the good things they did** over the cycle: their contribution to the team and the client, and any **process improvements** they brought in. Be specific: name the work, not just the trait.'},
  {t:'Share the areas for improvement as opportunities', who:'Reviewer', d:'Then share the **areas for improvement**. Frame them as **opportunities**: what this unlocks for them, and **how working on it helps them get to the next step**. The tone is the difference between someone leaving motivated and someone leaving defensive.'},
  {t:'Discuss their goals and achievements', who:'Reviewer', d:'Talk about **their goals** and what they have **achieved** against them. Where do they want to go next, and what does the path there look like from where they are now?'},
  {t:'Ask what the company can do better for them', who:'Reviewer', d:'Ask them directly: **what do you think we can do better for you** that would help you grow? This is the part most reviews skip, and it is the part that tells you why people leave. Listen to the answer and note it.'},
  {t:'Document the session on email and close the loop', who:'Supervisor', d:'The supervisor **sends an email to the employee** documenting everything from the session: what was appreciated, the areas for improvement agreed, the goals set, and what they asked for from us, and **keeps the hierarchy copied** on that email. **An appraisal conversation that was never written down did not happen**, and next October needs this cycle’s baseline to measure against.',
   note:{k:'comp', h:'No surprises in the room', x:'An appraisal one-on-one is not the place to raise a serious performance issue for the first time. Anything of that weight should already have been shared through documented feedback during the year (WF-09) or the progressive-discipline path (WF-05). Note also that an active warning letter deducts **0.25 from the rank for every month the letter is active**, counted from the month it was issued up to the appraisal month (WF-05): if that applies, the employee should already know before they walk in.'}},
  {t:'Everyone gets the one-on-one', who:'Reviewer', d:'The appraisal one-on-one happens in October for **everyone**, including employees on **PIP, Observation or probation**. Nobody is skipped because of their current status.'},
  {t:'The evaluation criteria are still being defined', who:'Management', d:'The parameters the appraisal will be scored against are still being worked on. **Everything above is confirmed; the criteria are not.** Once they are agreed they are added here and this document is re-versioned.',
   note:{k:'tip', h:'Until then', x:'Do not quote appraisal criteria to an employee from memory or from a previous cycle. If someone asks, the honest answer is that the cycle is in October, their one-on-one will be taken by the level above them, and the criteria are being finalised and will be published here.'}}
 ]}
]
},
{
id:'PL-06', cat:'policy', title:'Inter-departmental Coordination', short:'How work moves between departments: the documentation rule, task handoff and completion, client updates and new SOPs, and shared trackers.',
owner:'Every department lead, TL and above, from every department', applies:'All departments; every lead from TL upward owns their side of every handoff', version:'1.3', effective:'29 Sep 2026', review:'29 Mar 2027',
purpose:'Claims move across departments all day: AR to Submission, Submission to Payment Posting, EV and Credentialing feeding both. The single rule that holds this together is that a handoff nobody can find later did not happen. This document sets the documentation rule that applies to every department, then the three routines it applies to: a task handed from one department to another, a client update or new SOP that has to reach everyone, and a shared tracker that one department fills and another works.',
sections:[
 {type:'steps', name:'A. The documentation rule', time:'Every handoff, every time', steps:[
  {t:'Know which departments this covers', who:'Everyone', d:'Coordination runs between **AR, Payment Posting, Submission, EV (eligibility & verification) and Credentialing**, and any other department that a claim touches on its way through. The rule below applies to all of them equally, in every direction.'},
  {t:'Track it or email it: there is no third option', who:'Everyone', d:'Every piece of inter-departmental coordination is either **logged in a tracker** that both sides can see, or **documented on email**. Anything agreed on a call, on chat, or across the desk is confirmed in one of those two places straight after.',
   note:{k:'comp', h:'The rule', x:'A handoff that lives only in somebody’s memory is not a handoff. If it is not in the tracker or on email, the receiving department is not accountable for it and the sending department cannot say it was passed on.'}},
  {t:'Name what was handed over', who:'Sending department', d:'The tracker entry or the email says what is being handed over, which claims or accounts it covers, what the other department is being asked to do, and by when. “Please check” is not a handoff.'},
  {t:'Acknowledge and close the loop', who:'Receiving department', d:'The receiving department acknowledges in the same place: tracker or email thread, and confirms back when it is done or says what is blocking it. The thread closes; it does not just stop.'},
  {t:'Escalate through the matrix', who:'Supervisor', d:'Where a handoff stalls or the two departments disagree, it follows the escalation matrix in WF-07 rather than turning into a standing complaint between teams.'}
 ]},
 {type:'steps', name:'B. Task handoff and completion', time:'Every task shared between departments', steps:[
  {t:'Acknowledge the email and share a timeline', who:'Receiving department', d:'When one department shares a task with another, the department that received it **acknowledges the email** and **shares the timeline** by which the task will be completed. A task that was never acknowledged was never accepted.'},
  {t:'Send the completion email', who:'Receiving department', d:'Once the task is completed, a **completion email** goes back to the sending department on the same thread. That email is what closes the task; finishing the work without sending it leaves the task open on the other side.'},
  {t:'If it is not completed, say so before being asked', who:'Receiving department', d:'If, for whatever reason, the task was not completed in the timeline given, the receiving department shares this **proactively**, not when chased. The email must cover four things:',
   list:['**The reason** the task was not completed','**Any blockers** standing in the way','**What help is needed** to clear them, and from whom','**Any additional support** required beyond that'],
   note:{k:'comp', h:'Then a new date', x:'The same email carries an **updated timeline** by which the task can now be finished. A reason without a new date is a status update, not a plan.'}},
  {t:'Document every piece of it', who:'Both departments', d:'**Every single piece** of this conversation is documented: the handoff, the acknowledgement and timeline, the completion email, and any reason, blocker, help request and revised date along the way. All of it on email, on the one thread.'}
 ]},
 {type:'steps', name:'C. Client updates and new SOPs', time:'Whenever the client changes something', steps:[
  {t:'Share client updates with the other departments, on time', who:'Client-facing department', d:'The department that **communicates directly with the client** shares every client update with the other departments in a timely manner: changes to the **process**, the **software**, **payer rules**, and anything else that affects how the work is done. The other departments cannot follow a rule they were never told about.'},
  {t:'Acknowledge, and ask if anything is unclear', who:'Receiving departments', d:'Each department that receives the update **acknowledges it in a timely manner**. If anyone has **doubts or concerns**, they ask their questions then, on the same thread, rather than working on an assumption. The update, the acknowledgements and the questions are all **documented**.'},
  {t:'New workflow or process: a lead prepares the SOP', who:'Department lead', d:'If a **new workflow** is added, an existing one is updated, or a **specific process** now has to be followed by any department, a **lead from that department prepares the SOP**. It is then **shared with the users, with the hierarchy copied**, so the workflow is streamlined and everyone is working from the same document.'},
  {t:'Conduct a session on the update', who:'Department lead', d:'A **session is conducted with the team** on the update or the new SOP. Sending the document is not the same as the team understanding it.'},
  {t:'Assess, share the results, refresher for anyone who fails', who:'Department lead', d:'After the session, an **assessment is conducted** to confirm the team has understood the update. The **results are shared** accordingly, and **anyone who fails takes a refresher** before working on the changed process.'}
 ]},
 {type:'steps', name:'D. Shared trackers', time:'Wherever a tracker is followed', steps:[
  {t:'Know what a shared tracker is', who:'Everyone', d:'Some work between departments runs on a **tracker** rather than a one-off email. Example: the **EV tracker**, where one department uploads the accounts that another department needs to work on, and the working department updates the status against each account. The tracker is the record, but it does not replace the emails below.'},
  {t:'Email the other department when accounts are uploaded', who:'Uploading department', d:'The department that uploads accounts to the tracker **sends an email informing the other department** that the accounts are there and ready to be worked. Uploading silently and expecting the other side to notice is not a handoff.'},
  {t:'Complete the accounts and update the status, on time', who:'Working department', d:'The department that works the accounts **completes them and updates the status on the tracker in a timely manner**. The tracker is only useful if the status on it is true.'},
  {t:'If it is not completed, share the valid reason on email', who:'Working department', d:'If the accounts were not completed in time, the working department **shares the valid reason over email**, with the blockers, the help needed and the updated timeline. This is **the same process as Section B**, applied to tracker work.'}
 ]}
]
}
];
/* ================= APPLICATIONS DIRECTORY =================
   Admins edit apps in the page itself (Edit on any app card): status,
   link and description. Those edits save to that admin's own browser.
   To publish them to EVERYONE, press "Copy config" in the edit panel
   and replace the APP_BAKED line below with what was copied, then
   redeploy this file.                                              */
var APP_BAKED = {};

var APPS = [
 {key:'sashas-third-eye', name:'Sasha\u2019s Third Eye', tag:'Quality', status:'live', link:'https://purview-healthcare.github.io/Sashas-third-eye/', audience:'Internal: QA & supervisors',
  desc:'Upload the QA sheet and production sheet; returns a detailed QA and production dashboard, client-wise and team-wise.'},
 {key:'drishti', name:'Drishti', tag:'SLA & KPI', status:'live', link:'', audience:'Internal: managers & team leads',
  desc:'A client KPI and SLA dashboard that tells you whether targets are being met.'},
 {key:'brahmastra', name:'Purview Brahmastra', tag:'Coordination', status:'building', link:'', audience:'Internal: all departments',
  desc:'Upload work that needs multiple departments; it routes the tasks and tracks them to completion.'},
 {key:'coding-astra', name:'Coding Astra', tag:'Coding rules', status:'live', link:'https://purview-healthcare.github.io/coding-astra/', audience:'Clients & coding teams',
  desc:'CPT and specialty lookup for the right POS, modifiers and diagnoses, with the CMS source.'},

}

function docsIn(cat){ return SOPS.filter(function(s){ return s.cat===cat; }); }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hl(s){
  var out = esc(s);
  var q = state.q.trim();
  if(q.length >= 2){
    var safe = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp('('+safe+')','gi'), '<mark>$1</mark>');
  }
  return out;
}
function bold(str){ return str.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
function xref(str){
  return str.replace(/\b(WF|PL)-(\d\d)\b/g, function(m){
    return SOPS.some(function(s){return s.id===m;}) ? '<a class="xref" data-go="'+m+'">'+m+'</a>' : m;
  });
}
function noteHtml(n){
  if(!n) return '';
  var cls = {comp:'comp', esc:'esc', tip:'tip', time:'time'}[n.k] || 'tip';
  return '<div class="callout '+cls+'"><span class="ck">'+hl(n.h)+'</span>'+bold(xref(hl(n.x)))+'</div>';
}
function stageTag(n, t){ return n ? '<span class="stagetag">Stage '+n+' of '+t+'</span>' : '<span class="stagetag reftag">Reference</span>'; }
function miniTable(tb){
  var h = '<div class="minitable">' + (tb.title ? '<div class="mtitle">'+hl(tb.title)+'</div>' : '') + '<div class="tscroll"><table class="dt"><thead><tr>';
  tb.cols.forEach(function(c){ h += '<th>'+hl(c)+'</th>'; });
  h += '</tr></thead><tbody>';
  tb.rows.forEach(function(r){ h += '<tr>' + r.map(function(c){ return '<td>'+bold(xref(hl(c)))+'</td>'; }).join('') + '</tr>'; });
  h += '</tbody></table></div>';
  if(tb.note) h += '<p class="tabnote">'+bold(xref(hl(tb.note)))+'</p>';
  return h + '</div>';
}
function stepsHtml(sec, n, t){
  var h = '<div class="sec">'+stageTag(n,t)+'<h2>'+hl(sec.name)+(sec.time?'<span class="sectime">'+hl(sec.time)+'</span>':'')+'</h2>';
  (sec.tables || []).forEach(function(tb){ h += miniTable(tb); });
  h += '<ol class="steps">';
  sec.steps.forEach(function(st, i){
    h += '<li class="step"><div class="snum">'+(i+1)+'</div><div class="sbody">'
      + '<div class="st">'+hl(st.t)
      + (st.who ? '<span class="swho">'+hl(st.who)+'</span>' : '')
      + (st.when ? '<span class="swhen">'+hl(st.when)+'</span>' : '')
      + '</div><div class="sd">'+bold(xref(hl(st.d)))+(st.list?'<ul class="chk">'+st.list.map(function(x){return '<li>'+bold(xref(hl(x)))+'</li>';}).join('')+'</ul>':'')+'</div>'
      + (st.tables||[]).map(function(tb){ return miniTable(tb); }).join('')
      + noteHtml(st.note)
      + '</div></li>';
  });
  return h + '</ol></div>';
}
function tableHtml(sec, n, t){
  var h = '<div class="sec">'+stageTag(n,t)+'<h2>'+hl(sec.name)+'</h2><div class="tscroll"><table class="dt"><thead><tr>';
  sec.cols.forEach(function(c){ h += '<th>'+hl(c)+'</th>'; });
  h += '</tr></thead><tbody>';
  sec.rows.forEach(function(r){
    h += '<tr>' + r.map(function(c){ return '<td>'+bold(xref(hl(c)))+'</td>'; }).join('') + '</tr>';

  h += '</tbody></table></div>';
  if(sec.note) h += '<p class="tabnote">'+bold(xref(hl(sec.note)))+'</p>';

}
function tplHtml(sec, docIdx, secIdx, n, t){

    + '<button class="copybtn" data-copy="'+docIdx+':'+secIdx+'">Copy text</button></div>'
    + '<pre>'+hl(sec.body)+'</pre></div></div>';

function dodontHtml(sec, n, t){

  h += '<div class="col dont"><h4>Don\u2019t</h4><ul>' + sec.donts.map(function(x){return '<li>'+hl(x)+'</li>';}).join('') + '</ul></div>';

function flowStrip(doc){
  var h = '<div class="flowwrap"><div class="flowtitle">How this document runs: follow the stages in order</div><div class="flow">';
  var n = 0;
  doc.sections.forEach(function(sec, i){
    if(i) h += '<span class="farrow">\u2192</span>';
    var lbl = sec.ref ? '<b class="refdot">\u25cf</b>' : '<b>'+(++n)+'</b>';
    h += '<span class="fstep'+(sec.ref?' fref':'')+'" data-jump="'+doc.id+'-s'+(i+1)+'">'+lbl+esc(sec.name)+'</span>';
  });

}
function coverHtml(o){
  return '<div class="cover'+(o.art?' hasart focus-'+o.art:'')+'">'+(o.art?'<div class="isowrap">'+ISO_SVG+'</div>':'')+'<span class="cvsheen" aria-hidden="true"></span>'

    + '<div class="cvin"><span class="cvchip">'+o.chip+'</span>'
    + '<h1 class="cvtitle">'+o.title+'</h1>'

    + '</div></div>';

function readMins(doc){
  var n = (doc.purpose||'').split(/\s+/).length;
  doc.sections.forEach(function(sec){
    n += (sec.name||'').split(/\s+/).length;
    (sec.steps||[]).forEach(function(st){ n += (st.t+' '+st.d).split(/\s+/).length + (st.note?st.note.x.split(/\s+/).length:0); });
    (sec.rows||[]).forEach(function(r){ r.forEach(function(c){ n += String(c).split(/\s+/).length; }); });
    (sec.tables||[]).forEach(function(tb){ (tb.rows||[]).forEach(function(r){ r.forEach(function(c){ n += String(c).split(/\s+/).length; }); }); });
  });
  return Math.max(1, Math.round(n/210));
}

function searchHits(){
  var q = state.q.trim().toLowerCase();
  var hits = [];
  SOPS.forEach(function(s){
    var snippets = [];
    function grab(txt){
      var lower = txt.toLowerCase(), pos = lower.indexOf(q);
      if(pos > -1 && snippets.length < 3){
        var start = Math.max(0, pos-60);
        snippets.push((start>0?'\u2026':'') + txt.slice(start, pos+q.length+90) + '\u2026');
      }
    }
    grab(s.title); grab(s.short); grab(s.purpose);
    s.sections.forEach(function(sec){
      if(sec.name) grab(sec.name);
      (sec.steps||[]).forEach(function(st){ grab(st.t); grab(st.d); if(st.note) grab(st.note.x); });
      (sec.rows||[]).forEach(function(r){ grab(r.join(' \u2014 ')); });
      if(sec.body) grab(sec.body);
      (sec.dos||[]).forEach(grab); (sec.donts||[]).forEach(grab);
    });
    if(snippets.length) hits.push({doc:s, snippets:snippets});
  });
  var appHits = APPS.filter(function(a){
    return (a.name+' '+a.desc+' '+a.use+' '+a.tag).toLowerCase().indexOf(q) > -1;
  });
  return {docs:hits, apps:appHits};
}

  var prog = document.getElementById('progress');
  if(prog) prog.classList.toggle('on', state.view==='doc');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var targets = document.querySelectorAll('.sec, .homecard, .appcard, .flowwrap');
  if(reduce || !('IntersectionObserver' in window)){
    Array.prototype.forEach.call(targets, function(el){ el.classList.add('in'); });
    return;
  }
  if(_rvObs) _rvObs.disconnect();
  _rvObs = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){ en.target.classList.add('in'); _rvObs.unobserve(en.target); }
    });
  }, {rootMargin:'0px 0px -8% 0px', threshold:0.06});
  Array.prototype.forEach.call(targets, function(el, i){
    el.classList.add('rv');
    el.style.transitionDelay = Math.min(i,6)*45 + 'ms';
    _rvObs.observe(el);
  });
}
function updateProgress(){
  var prog = document.getElementById('progress');
  if(!prog) return;
  if(state.view!=='doc'){ prog.style.width='0'; return; }
  var d = document.documentElement;
  var max = (d.scrollHeight - d.clientHeight) || 1;
  var pct = Math.max(0, Math.min(100, (d.scrollTop / max) * 100));
  prog.style.width = pct + '%';
}
window.addEventListener('scroll', function(){ updateProgress(); syncRail(); }, {passive:true});
window.addEventListener('resize', updateProgress);
function countUp(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var els = document.querySelectorAll('.hsnum');
  Array.prototype.forEach.call(els, function(el){
    var txt = el.textContent, m = txt.match(/^(\d+)$/);
    if(!m) return;
    var target = parseInt(m[1],10), start = null, dur = 700;
    el.textContent = '0';
    function tick(ts){
      if(start===null) start = ts;
      var p = Math.min(1,(ts-start)/dur), e = 1-Math.pow(1-p,3);
      el.textContent = String(Math.round(target*e));
      if(p<1) requestAnimationFrame(tick); else el.textContent = String(target);
    }
    requestAnimationFrame(tick);
  });
}
function go(target){
  state.editApp = null;
  if(target==='home'){ state.view='home'; state.id=null; }
  else if(target.indexOf('cat:')===0){ state.view='cat'; state.id=target.slice(4); }
  else { state.view='doc'; state.id=target; }
  render();
}
document.body.addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('.applink')) return;
  var act = e.target.closest ? e.target.closest('[data-act]') : null;
  if(act){
    var a = act.getAttribute('data-act');
    if(a==='edit'){
      var key = act.getAttribute('data-key');
      var app = APPS.filter(function(x){return x.key===key;})[0];
      editDraft = {status:appVal(app,'status'), link:appVal(app,'link')||'', desc:appVal(app,'desc')};
      state.editApp = key; render(); return;
    }
    if(a==='status'){ editDraft.status = act.getAttribute('data-val'); render(); return; }
    if(a==='cancel'){ state.editApp=null; render(); return; }
    if(a==='save'){
      var k = state.editApp, app2 = APPS.filter(function(x){return x.key===k;})[0];
      var link = (editDraft.link||'').trim();
      if(link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
      var o = {};
      if(editDraft.status !== app2.status) o.status = editDraft.status;
      if(link !== (app2.link||'')) o.link = link;
      if((editDraft.desc||'').trim() !== app2.desc) o.desc = (editDraft.desc||'').trim();
      if(Object.keys(o).length) APP_OVERRIDES[k] = o; else delete APP_OVERRIDES[k];
      var ok = saveOverrides();
      state.editApp = null; render();
      if(!ok) alert('Changes applied for this visit, but could not be stored in this browser. Use Copy config to make them permanent.');
      return;
    }
    if(a==='copycfg'){
      var k2 = state.editApp, app3 = APPS.filter(function(x){return x.key===k2;})[0];
      var link2 = (editDraft.link||'').trim();
      if(link2 && !/^https?:\/\//i.test(link2)) link2 = 'https://' + link2;
      var tmp = {};
      if(editDraft.status !== app3.status) tmp.status = editDraft.status;
      if(link2 !== (app3.link||'')) tmp.link = link2;
      if((editDraft.desc||'').trim() !== app3.desc) tmp.desc = (editDraft.desc||'').trim();
      var prev = APP_OVERRIDES[k2];
      if(Object.keys(tmp).length) APP_OVERRIDES[k2] = tmp; else delete APP_OVERRIDES[k2];
      var text = bakedConfigText();
      if(prev) APP_OVERRIDES[k2] = prev; else delete APP_OVERRIDES[k2];
      var done = function(){ act.textContent='Copied'; setTimeout(function(){ act.textContent='Copy config'; }, 1800); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, done); }
      else { var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(err){} document.body.removeChild(ta); done(); }
      return;
    }
  }
  var jump = e.target.closest ? e.target.closest('[data-jump]') : null;
  if(jump){
    var el = document.getElementById(jump.getAttribute('data-jump'));
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
    return;
  }
  var face = e.target.closest ? e.target.closest('.doorface') : null;
  if(face){
    var wrap = face.closest('.doorwrap');
    openDoor(wrap.getAttribute('data-door'), wrap); return;
  }
  var t = e.target.closest ? e.target.closest('[data-go]') : null;
  if(t){ go(t.getAttribute('data-go')); return; }
  var c = e.target.closest ? e.target.closest('[data-copy]') : null;
  if(c){
    var parts = c.getAttribute('data-copy').split(':');
    var body = SOPS[+parts[0]].sections[+parts[1]].body;
    var done = function(){ c.textContent='Copied'; setTimeout(function(){ c.textContent='Copy text'; }, 1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(body).then(done, done); }
    else {
      var ta = document.createElement('textarea'); ta.value = body; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); }catch(err){} document.body.removeChild(ta); done();
    }
  }
});
document.body.addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    var t = e.target.closest ? e.target.closest('[data-go]') : null;
    if(t && (t.classList.contains('homecard')||t.classList.contains('bigcard'))) go(t.getAttribute('data-go'));
  }
});
document.body.addEventListener('input', function(e){
  if(e.target.id==='ed-link') editDraft.link = e.target.value;
  if(e.target.id==='ed-desc') editDraft.desc = e.target.value;
});
$q.addEventListener('input', function(){
  state.q = $q.value;
  if(state.q.trim().length >= 2){ state.view='search'; render(); }
  else if(state.view==='search'){ state.view='home'; render(); }
  else { render(); }
});
(function(){
  var bt = document.getElementById('browsetoggle'), ab = document.getElementById('asidebody');
  if(bt && ab) bt.addEventListener('click', function(){
    var open = ab.classList.toggle('show');
    bt.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.body.addEventListener('click', function(e){
    if(window.innerWidth <= 900 && e.target.closest && e.target.closest('#asidebody [data-go]')){
      ab.classList.remove('show'); bt.setAttribute('aria-expanded','false');
    }
  });
})();
render();
</script>
</body>
